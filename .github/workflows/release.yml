name: Release

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the shell scripts
        run: |
          sudo apt-get install -y shellcheck
          bash -n install.sh scripts/palctl scripts/palcms-config
          shellcheck -S error install.sh scripts/palctl scripts/palcms-config
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm release
      # Release notes: release-notes/<tag>.md, otherwise the version section of the CHANGELOG.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release/notes.md
          else
            awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v { p = 1; print; next } /^## / { if (p) exit } p' CHANGELOG.md > release/notes.md
            printf '\n```bash\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | sudo bash\n```\n' "$GITHUB_REPOSITORY" >> release/notes.md
          fi
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/notes.md
          files: |
            release/palcms.tar.gz
            release/install.sh
