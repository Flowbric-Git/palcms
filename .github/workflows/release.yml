name: Release

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Vérification des scripts shell
        run: |
          sudo apt-get install -y shellcheck
          bash -n install.sh scripts/palctl scripts/palcms-config
          shellcheck -S error install.sh scripts/palctl scripts/palcms-config
      - name: Version depuis le tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm release
      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/palcms.tar.gz
            release/install.sh
